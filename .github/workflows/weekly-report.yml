name: 运动打卡周报

on:
  schedule:
    # 每周一 09:00 (北京时间) = 01:00 UTC
    - cron: '0 1 * * 1'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write
  issues: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    env:
      WX_APPID: ${{ secrets.WX_APPID }}
      WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
      WX_ENV: ${{ secrets.WX_ENV }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 安装中文字体（避免中文渲染成方框）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        working-directory: weekly-report
        run: npm install

      - name: 生成周报
        working-directory: weekly-report
        run: |
          # 固定取“上周日”，保证周报始终是上一个完整自然周（周一到周日）
          REPORT_DATE=$(date -d "last sunday" +%F)
          echo "周报日期锚点: $REPORT_DATE"
          node generate.js --source cloud --date "$REPORT_DATE"

      - name: 上传周报图片
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report
          path: weekly-report/output/*.png
          retention-days: 30
          if-no-files-found: error

      - name: 提交周报图片到仓库 reports/ 目录
        run: |
          mkdir -p reports
          cp weekly-report/output/*.png reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "发布周报图片" || echo "无需提交"
          git push

      - name: 创建周报 Issue（标题 = 图片文件名）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PNG=$(ls weekly-report/output/*.png | head -1)
          TITLE=$(basename "$PNG")
          BODY="![周报](reports/$(basename "$PNG"))"
          EXISTING=$(gh issue list --state all --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "已更新已有 Issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
